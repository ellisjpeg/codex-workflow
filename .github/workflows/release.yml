name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --engine-strict
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - name: Build updater asset
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/stage-release.mjs "$version" "dist/stage/codex-workflow-$version"
          tar -C dist/stage -czf "dist/codex-workflow-$version.tar.gz" "codex-workflow-$version"
      - name: Create release draft for review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-draft.mjs "$GITHUB_REF_NAME" "dist/codex-workflow-$version.tar.gz"
